openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: articles
    description: Artikel operations (synced with Dropbox plist file)
paths:
  /access:
    get:
      operationId: getAccess
      responses:
        "200":
          description: Authenticated access status
          content:
            application/json:
              schema:
                type: object
                required: [allowed, configured]
                properties:
                  allowed: { type: boolean }
                  configured: { type: boolean }
  /settings:
    get:
      operationId: getStorageSettings
      responses:
        "200":
          description: Storage and credential status, never secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSettings"
    put:
      operationId: saveStorageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoragePathsInput"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSettings"
  /settings/dropbox/connect:
    post:
      operationId: connectOwnDropbox
      responses:
        "200":
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
  /settings/dropbox/disconnect:
    post:
      operationId: disconnectOwnDropbox
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSettings"
  /settings/dropbox/browse:
    get:
      operationId: browseDropbox
      parameters:
        - { name: path, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Dropbox folders and plist files
          content:
            application/json:
              schema:
                type: object
                required: [entries, cursor, hasMore]
                properties:
                  cursor: { type: string }
                  hasMore: { type: boolean }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, path, kind]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        kind: { type: string, enum: [folder, file] }
  /transfer/preview:
    post:
      operationId: previewImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Validated preview and short-lived confirmation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
  /transfer/import:
    post:
      operationId: confirmImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmation"
      responses:
        "200":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
  /transfer/export:
    post:
      operationId: exportToDropbox
      responses:
        "200":
          description: Export written to configured Dropbox path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List articles
      description: Returns a paginated, searchable list of articles
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: sparte
          in: query
          schema:
            type: string
        - name: wg
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"
    post:
      operationId: createArticle
      tags: [articles]
      summary: Create article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Created article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
  /articles/{id}/clone:
    post:
      operationId: cloneArticle
      tags: [articles]
      summary: Clone saved article with the next number above the highest existing article number
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Cloned article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Source article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Clone could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get a single article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateArticle
      tags: [articles]
      summary: Update an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteArticle
      tags: [articles]
      summary: Delete an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /meta:
    get:
      operationId: getMeta
      tags: [articles]
      summary: Get metadata for dropdowns and sync status
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
  /sync:
    post:
      operationId: syncFromDropbox
      tags: [articles]
      summary: Reload the article list from the Dropbox plist file
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
  /sync-config:
    get:
      operationId: getSyncConfig
      responses:
        "200":
          description: Current sync interval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConfig"
    put:
      operationId: setSyncConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncConfigInput"
      responses:
        "200":
          description: Updated sync interval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConfig"
components:
  schemas:
    StoragePathsInput:
      type: object
      required: [mode, provider, importPath, exportPath]
      properties:
        mode: { type: string, enum: [dropbox, local] }
        provider: { type: string, enum: [connector, own] }
        importPath: { type: string }
        exportPath: { type: string }
    StorageSettings:
      allOf:
        - $ref: "#/components/schemas/StoragePathsInput"
        - type: object
          required: [appKeyConfigured, appSecretConfigured, ownConnected, redirectUri]
          properties:
            appKeyConfigured: { type: boolean }
            appSecretConfigured: { type: boolean }
            ownConnected: { type: boolean }
            redirectUri: { type: string }
    ImportInput:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [local, dropbox] }
        content: { type: string, maxLength: 10000000 }
    ImportConfirmation:
      allOf:
        - $ref: "#/components/schemas/ImportInput"
        - type: object
          required: [token]
          properties:
            token: { type: string }
    ImportPreview:
      type: object
      required: [count, currentCount, token, destination, sample]
      properties:
        count: { type: integer }
        currentCount: { type: integer }
        token: { type: string }
        destination: { type: string }
        sample:
          type: array
          items:
            type: object
            required: [ArtikelId, Artikel, Preis]
            properties:
              ArtikelId: { type: string }
              Artikel: { type: string }
              Preis: { type: string }
    TransferResult:
      type: object
      required: [count, message]
      properties:
        count: { type: integer }
        message: { type: string }
    SyncConfig:
      type: object
      required: [intervalMs, nextSyncAt]
      properties:
        intervalMs:
          type: integer
          minimum: 0
        nextSyncAt:
          type: [string, "null"]
          description: ISO 8601 timestamp of the next scheduled automatic sync, or null when not scheduled.
    SyncConfigInput:
      type: object
      required: [intervalMs]
      properties:
        intervalMs:
          type: integer
          minimum: 0
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: string
      required:
        - success
        - id
    Article:
      type: object
      description: Ein Artikel aus dem Kassensystem (Dropbox artikelData.plist)
      properties:
        ArtikelId:
          type: string
          description: Eindeutige Artikelnummer
        Artikel:
          type: string
          description: Artikelname
        BarCode:
          type: string
        ComboArtikel:
          type: string
        Drucker:
          type: string
          description: Bondrucker-Ziel (z.B. Tresen, Kueche, Gutscheindruck)
        FreierPreis:
          type: string
          description: "\"1\" wenn freier Preis erlaubt ist, sonst \"0\""
        Gutschrift:
          type: string
        LongText:
          type: string
        MWSt:
          type: string
          description: Mehrwertsteuersatz
        MWStAH:
          type: string
          description: Mehrwertsteuersatz Außer Haus
        Maincourse:
          type: string
        NichtUmsatzRelevant:
          type: string
        PicturePath:
          type: string
        Preis:
          type: string
          description: Verkaufspreis
        PreisAH:
          type: string
          description: Verkaufspreis Außer Haus
        Preisliste:
          type: string
        RabattAusnahme:
          type: string
        Rezeptur:
          type: string
        Sparte:
          type: string
        SpartenId:
          type: string
        SpartenSteuerung:
          type: string
        WG:
          type: string
          description: Warengruppe
        Zusatztext:
          type: string
        FollowStock:
          type: string
        ArticleDailyInitialCount:
          type: string
        Expenses:
          type: string
        Intern:
          type: string
        Manufacturer:
          type: string
        ManufacturerID:
          type: string
        ManufacturerItemName:
          type: string
        Naehrwertangaben:
          type: string
        Ordercode:
          type: string
        PurchasePrice:
          type: string
        sort:
          type: string
        articleTSE:
          type: string
        printEvenZero:
          type: string
        showArticleOnlyForThisUser:
          type: string
        ArtikelTextLang:
          type: string
      required:
        - ArtikelId
        - Artikel
    ArticleInput:
      allOf:
        - $ref: "#/components/schemas/Article"
      description: Gleiche Felder wie Article; ArtikelId ist beim Anlegen optional (wird automatisch vergeben)
    ArticleListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - items
        - total
        - page
        - pageSize
    MetaResponse:
      type: object
      properties:
        gesamtAnzahl:
          type: integer
        letzteSynchronisierung:
          type: string
          format: date-time
        letzteSynchronisierungFehler:
          type: string
          nullable: true
          description: Fehlermeldung des letzten fehlgeschlagenen Auto-Syncs, oder null wenn der letzte Sync erfolgreich war
        sparten:
          type: array
          items:
            type: string
        druckerListe:
          type: array
          items:
            type: string
        preislisten:
          type: array
          items:
            type: string
        warengruppen:
          type: array
          items:
            type: string
      required:
        - gesamtAnzahl
        - letzteSynchronisierung
        - sparten
        - druckerListe
        - preislisten
        - warengruppen
